# Weekly update PRs for pinned actions and locked dependencies. Review action
# updates carefully: release jobs give actions access to the signing secrets.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule: { interval: weekly }
  - package-ecosystem: pip
    directory: /sidecar
    schedule: { interval: weekly }
